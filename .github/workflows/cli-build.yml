name: CLI Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-build-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  ZCODE_ENV: production
  ZCODE_SKIP_REMOTE_ASSETS: "1"

jobs:
  cli-win:
    name: CLI (win-x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build ZCode CLI distribution
        run: pnpm build:zcode --base-url http://127.0.0.1/zcode/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-win-x64
          path: dist/zcode/
          retention-days: 14
